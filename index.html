<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Meus sites favoritos: Natali Louro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; text-align: center; }
        .main-title { color: #4761cf; margin-bottom: 30px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .site-card { background: white; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .site-title { color: #4761cf; font-size: 24px; margin-bottom: 15px; }
        .site-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; }
        .site-link { display: inline-block; color: #4761cf; text-decoration: none; font-weight: bold; }
        .site-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1 class="main-title">Meus sites favoritos: Natali Louro</h1>
    <div class="container">
        
        <!-- ITEM 1: GitHub -->
        <div class="site-card">
            <h1 class="site-title">GitHub</h1>
            <a href="https://github.com" target="_blank">
                <img src="img/github.png" alt="Logo do GitHub" class="site-img">
            </a>
            <br>
            <a href="https://github.com" target="_blank" class="site-link">Acessar GitHub</a>
        </div>

        <!-- ITEM 2: Canva -->
        <div class="site-card">
            <h1 class="site-title">Canva</h1>
            <a href="https://www.canva.com" target="_blank">
                <img src="img/canva.png" alt="Logo do Canva" class="site-img">
            </a>
            <br>
            <a href="https://www.canva.com" target="_blank" class="site-link">Acessar Canva</a>
        </div>

        <!-- ITEM 3: W3Schools -->
        <div class="site-card">
            <h1 class="site-title">W3Schools</h1>
            <a href="https://www.w3schools.com" target="_blank">
                <img src="img/w3schools.png" alt="Logo do W3Schools" class="site-img">
            </a>
            <br>
            <a href="https://www.w3schools.com" target="_blank" class="site-link">Acessar W3Schools</a>
        </div>

        <!-- ITEM 4: MDN -->
        <div class="site-card">
            <h1 class="site-title">MDN Web Docs</h1>
            <a href="https://developer.mozilla.org" target="_blank">
                <img src="img/mdn.png" alt="Logo do MDN" class="site-img">
            </a>
            <br>
            <a href="https://developer.mozilla.org" target="_blank" class="site-link">Acessar MDN</a>
        </div>

        <!-- ITEM 5: YouTube -->
        <div class="site-card">
            <h1 class="site-title">YouTube</h1>
            <a href="https://www.youtube.com" target="_blank">
                <img src="img/youtube.png" alt="Logo do YouTube" class="site-img">
            </a>
            <br>
            <a href="https://www.youtube.com" target="_blank" class="site-link">Acessar YouTube</a>
        </div>

    </div>
</body>
</html>
